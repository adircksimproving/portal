<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portal</title>
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/account.css">
    <link rel="stylesheet" href="/styles/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Khula:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; }
        .nav-brand { display: flex; align-items: center; gap: 0.75rem; }
        .nav-brand-logo { height: 28px; width: auto; }
        .nav-brand-sep { width: 1px; height: 20px; background: #d1d5db; }
        .nav-brand-app { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; color: #1a1a1a; }
        .btn-signout {
            padding: 0.4rem 1rem; border: 1px solid #e5e7eb; border-radius: 6px;
            background: white; font-size: 13px; font-weight: 500; color: #6b7280;
            cursor: pointer; font-family: inherit;
        }
        .btn-signout:hover { background: #f9fafb; color: #374151; }
        .signout-form { display: inline; margin: 0; }
        .welcome { margin-bottom: 2rem; }
        .welcome-title { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 0.25rem; }
        .welcome-sub { font-size: 15px; color: #6b7280; }
        .apps-label { font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
        .app-tile {
            background: white; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 1.5rem; text-decoration: none; color: inherit; display: block;
            transition: box-shadow 0.15s, border-color 0.15s;
        }
        .app-tile:hover { border-color: #005596; box-shadow: 0 4px 16px rgba(0,85,150,0.1); }
        .app-tile-icon { font-size: 32px; margin-bottom: 0.875rem; }
        .app-tile-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    </style>
</head>
<body>
    <div id="impersonation-banner" class="impersonation-banner" hidden></div>
    <div class="container">
        <nav class="nav">
            <div class="nav-brand">
                <img src="/assets/improving-logo-simple.png" alt="Improving" class="nav-brand-logo">
                <span class="nav-brand-sep"></span>
                <span class="nav-brand-app">Project Portal</span>
            </div>
            <div class="nav-right">
                <a id="admin-link" href="/admin" class="btn-signout" hidden>Admin</a>
                <a href="/profile" class="btn-user">
                    <div class="btn-user-avatar" id="user-avatar"></div>
                    <span id="user-name"></span>
                </a>
                <form method="POST" action="/auth/logout" class="signout-form">
                    <button type="submit" class="btn-signout">Sign out</button>
                </form>
            </div>
        </nav>

        <div class="welcome">
            <div class="welcome-title">Welcome back</div>
            <p class="welcome-sub">Select an application to get started.</p>
        </div>

        <div class="apps-label">Applications</div>
        <div class="app-grid">
            <a id="tile-rev" href="#" class="app-tile">
                <div class="app-tile-icon">📈</div>
                <div class="app-tile-name">Project Revenue Forecasting</div>
            </a>
            <a id="tile-dir" href="#" class="app-tile">
                <div class="app-tile-icon">👥</div>
                <div class="app-tile-name">Consultant Directory</div>
            </a>
        </div>
    </div>

    <script type="module">
        import { renderImpersonationBanner } from '/assets/portal-session.js';
        const me = await fetch('/api/me').then(r => r.ok ? r.json() : null);
        if (!me) { location.href = '/'; }
        document.getElementById('user-name').textContent = me.username;
        document.getElementById('user-avatar').textContent = initials(me.username);
        if (me.is_admin || me.impersonator?.id) document.getElementById('admin-link').hidden = false;
        renderImpersonationBanner(me);
        function initials(name) {
            const parts = name.split(/[.\s@_-]+/).filter(Boolean);
            return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || name[0].toUpperCase();
        }

        const isProd = window.location.hostname !== 'localhost';
        const revBase = isProd
            ? 'https://revenue-analysis-app-production.up.railway.app'
            : 'http://localhost:3000';
        const dirBase = isProd
            ? 'https://consultant-directory-app-production.up.railway.app'
            : 'http://localhost:3002';

        function handoffUrl(appBase) {
            const callback = `${appBase}/auth/callback?next=%2Fhome.html`;
            return `/auth/handoff?return=${encodeURIComponent(callback)}`;
        }

        document.getElementById('tile-rev').href = handoffUrl(revBase);
        document.getElementById('tile-dir').href = handoffUrl(dirBase);
    </script>
</body>
</html>
